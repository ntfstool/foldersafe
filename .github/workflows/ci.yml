name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: FolderSafeCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: client/foldersafe_apple_core
        run: swift test

  fileprovider:
    name: File Provider offline tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: fp-store-tests / fp-extension-tests
        working-directory: client/foldersafe_apple/FileProviderTests
        run: swift run -c debug fp-store-tests && swift run -c debug fp-extension-tests

  interop:
    name: Interop with Cryptomator libraries (test-only AGPL dependency)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - name: Maven
        run: command -v mvn || brew install maven
      - name: run-interop.sh
        run: interop/run-interop.sh

  apps:
    name: Apps build (unsigned)
    runs-on: macos-latest
    # Needs a runner image with Xcode 26+ (FSKit extension targets macOS 26).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate project
        working-directory: client/foldersafe_apple
        run: xcodegen generate
      - name: Build FolderSafeMac
        working-directory: client/foldersafe_apple
        run: xcodebuild -project FolderSafe.xcodeproj -scheme FolderSafeMac -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build FolderSafeiOS
        working-directory: client/foldersafe_apple
        run: xcodebuild -project FolderSafe.xcodeproj -scheme FolderSafeiOS -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
